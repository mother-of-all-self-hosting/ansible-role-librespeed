---
- name: Check existence of LibreSpeed systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ librespeed_identifier }}.service"
  register: librespeed_service_stat

- name: Uninstall LibreSpeed systemd services and files
  when: librespeed_service_stat.stat.exists | bool
  block:
    - name: Ensure LibreSpeed systemd service is stopped
      ansible.builtin.service:
        name: "{{ librespeed_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure LibreSpeed systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ librespeed_identifier }}.service"
        state: absent

    - name: Ensure LibreSpeed support files do not exist
      ansible.builtin.file:
        path: "{{ librespeed_base_path }}/{{ item }}"
        state: absent
      with_items:
        - env
        - labels

    - name: Ensure LibreSpeed configuration path does not exist
      ansible.builtin.file:
        path: "{{ librespeed_config_path }}"
        state: absent

    - name: Ensure LibreSpeed local database path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ librespeed_database_path }}"
      register: librespeed_database_path_deletion_result
      changed_when: librespeed_database_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure LibreSpeed base path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ librespeed_base_path }}"
      register: librespeed_base_path_deletion_result
      changed_when: librespeed_base_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure LibreSpeed container network does not exist
      when: librespeed_container_network_deletion_enabled
      block:
        - name: Ensure LibreSpeed container network does not exist via community.docker.docker_network
          when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ librespeed_container_network }}"
            state: absent
          register: librespeed_network_deletion_result

        - name: Ensure LibreSpeed container network does not exist via ansible.builtin.command
          when: devture_systemd_docker_base_container_network_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} network rm
              {{ librespeed_container_network }}
          register: librespeed_network_deletion_result
          changed_when: librespeed_container_network in librespeed_network_deletion_result.stdout

- name: Check existence of LibreSpeed local database path
  ansible.builtin.stat:
    path: "{{ librespeed_database_path }}"
  register: librespeed_database_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Inject the message about the remaining LibreSpeed local database path
  when: librespeed_database_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: As the local LibreSpeed instance has been removed, some old data remains in `" + librespeed_database_path + "`. Feel free to delete it."
        ]
      }}
