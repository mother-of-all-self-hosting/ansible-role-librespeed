---
# Project source code URL: https://github.com/librespeed/speedtest

librespeed_enabled: true

librespeed_identifier: librespeed
librespeed_base_path: "/{{ librespeed_identifier }}"
librespeed_config_path: "{{ librespeed_base_path }}/config"
librespeed_database_path: "{{ librespeed_base_path }}/database"

# renovate: datasource=docker depName=ghcr.io/librespeed/speedtest versioning=semver
librespeed_version: 6.3.1

librespeed_uid: ""
librespeed_gid: ""

# The scheme used for serving LibreSpeed.
librespeed_scheme: https

# The hostname at which LibreSpeed is served.
librespeed_hostname: ""

# The path at which LibreSpeed is served.
# This value must either be `/` or not end with a slash (e.g. `/librespeed`).
librespeed_path_prefix: /

librespeed_container_image: "{{ librespeed_container_image_registry_prefix }}librespeed/speedtest:{{ librespeed_container_image_tag }}"
librespeed_container_image_tag: "{{ librespeed_version }}-alpine"
librespeed_container_image_registry_prefix: "{{ librespeed_container_image_registry_prefix_upstream }}"
librespeed_container_image_registry_prefix_upstream: "{{ librespeed_container_image_registry_prefix_upstream_default }}"
librespeed_container_image_registry_prefix_upstream_default: ghcr.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
librespeed_container_network: "{{ librespeed_identifier }}"

# Control if the container network is deleted on uninstalling.
librespeed_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `librespeed_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
librespeed_container_http_host_bind_port: ""

# The port number in the container
librespeed_container_http_port: 8080

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
librespeed_container_additional_networks: "{{ librespeed_container_additional_networks_auto + librespeed_container_additional_networks_custom }}"
librespeed_container_additional_networks_auto: []
librespeed_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
#
# On each start the container copies its files from `/speedtest` to the web root, so mount yours under `/speedtest`.
# For example, mounting a file to `/speedtest/frontend/images/logo.svg` replaces the logo of the new design.
# Any file mounted under `/speedtest/frontend` is served under `/frontend`.
librespeed_container_additional_volumes: "{{ librespeed_container_additional_volumes_auto + librespeed_container_additional_volumes_custom }}"
librespeed_container_additional_volumes_auto: []
librespeed_container_additional_volumes_custom: []

# librespeed_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `librespeed_container_labels_additional_labels_custom`.
librespeed_container_labels_traefik_enabled: true
librespeed_container_labels_traefik_docker_network: "{{ librespeed_container_network }}"
librespeed_container_labels_traefik_hostname: "{{ librespeed_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/librespeed`).
librespeed_container_labels_traefik_path_prefix: "{{ librespeed_path_prefix }}"
librespeed_container_labels_traefik_rule: "Host(`{{ librespeed_container_labels_traefik_hostname }}`){% if librespeed_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ librespeed_container_labels_traefik_path_prefix }}`){% endif %}"
librespeed_container_labels_traefik_priority: 0
librespeed_container_labels_traefik_entrypoints: web-secure
librespeed_container_labels_traefik_tls: "{{ librespeed_container_labels_traefik_entrypoints != 'web' }}"
librespeed_container_labels_traefik_tls_certResolver: default  # noqa var-naming
librespeed_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
librespeed_container_labels_traefik_middleware_basic_auth_users: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `librespeed_container_labels_traefik_additional_request_headers_custom`
librespeed_container_labels_traefik_additional_request_headers: "{{ librespeed_container_labels_traefik_additional_request_headers_auto | combine(librespeed_container_labels_traefik_additional_request_headers_custom) }}"
librespeed_container_labels_traefik_additional_request_headers_auto: {}
librespeed_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `librespeed_container_labels_traefik_additional_response_headers_custom`
librespeed_container_labels_traefik_additional_response_headers: "{{ librespeed_container_labels_traefik_additional_response_headers_auto | combine(librespeed_container_labels_traefik_additional_response_headers_custom) }}"
librespeed_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': librespeed_http_header_xss_protection} if librespeed_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': librespeed_http_header_content_type_options} if librespeed_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': librespeed_http_header_content_security_policy} if librespeed_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': librespeed_http_header_permissions_policy} if librespeed_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': librespeed_http_header_strict_transport_security} if librespeed_http_header_strict_transport_security and librespeed_container_labels_traefik_tls else {})
  }}
librespeed_container_labels_traefik_additional_response_headers_custom: {}

# librespeed_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `librespeed_container_labels_additional_labels_custom`
#
# Example:
# librespeed_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
librespeed_container_labels_additional_labels: "{{ librespeed_container_labels_additional_labels_auto + librespeed_container_labels_additional_labels_custom }}"
librespeed_container_labels_additional_labels_auto: []
librespeed_container_labels_additional_labels_custom: []

# Specify the size of the container's tmpfs volume
librespeed_container_tmpfs_tmp_size: 128m

# A list of extra arguments to pass to the container (`docker create` command)
librespeed_container_extra_arguments: "{{ librespeed_container_extra_arguments_auto + librespeed_container_extra_arguments_custom }}"
librespeed_container_extra_arguments_auto: []
librespeed_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
# Example: ['--SOME_ARGUMENT']
librespeed_process_extra_arguments: "{{ librespeed_process_extra_arguments_auto + librespeed_process_extra_arguments_custom }}"
librespeed_process_extra_arguments_auto: []
librespeed_process_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
librespeed_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
librespeed_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
librespeed_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
librespeed_http_header_permissions_policy: "{{ 'interest-cohort=()' if librespeed_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
librespeed_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if librespeed_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `librespeed_http_header_permissions_policy`
librespeed_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `librespeed_http_header_strict_transport_security`
librespeed_hsts_preload_enabled: false

# List of systemd services that the LibreSpeed systemd service depends on
librespeed_systemd_required_services_list: "{{ librespeed_systemd_required_services_list_default + librespeed_systemd_required_services_list_auto + librespeed_systemd_required_services_list_custom }}"
librespeed_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
librespeed_systemd_required_services_list_auto: []
librespeed_systemd_required_services_list_custom: []

# List of systemd services that the LibreSpeed systemd service wants
librespeed_systemd_wanted_services_list: "{{ librespeed_systemd_wanted_services_list_default + librespeed_systemd_wanted_services_list_auto + librespeed_systemd_wanted_services_list_custom }}"
librespeed_systemd_wanted_services_list_default: []
librespeed_systemd_wanted_services_list_auto: []
librespeed_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
librespeed_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
librespeed_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
librespeed_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
librespeed_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ librespeed_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ librespeed_container_stop_grace_time_seconds }} {{ librespeed_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ librespeed_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ librespeed_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ librespeed_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ librespeed_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ librespeed_identifier }} after {{ librespeed_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
librespeed_environment_variables_tz: UTC

# Specify the mode to run LibreSpeed in
#
# Valid values: standalone, backend, frontend, dual
# See https://github.com/librespeed/speedtest/blob/master/doc_docker.md for what each of them does.
librespeed_environment_variables_mode: standalone

# Specify the title of the speed test
librespeed_environment_variables_title: LibreSpeed

# Specify the slogan shown below the heading (new design only)
librespeed_environment_variables_tagline: No Flash, No Java, No Websockets, No Bullsh*t

# Control whether the new design is used by default, instead of the classic one
#
# The classic design ignores `settings.json` (see `librespeed_configuration`), and its privacy policy says
# that telemetry is enabled, even if it is not (see `librespeed_environment_variables_telemetry`).
#
# Visitors can choose a design with the `?design=new` and `?design=old` URL parameters.
librespeed_environment_variables_use_new_design: false

# Specify the URL of the server list to use
#
# `server-list.json` is the list which is generated from `librespeed_server_list`.
# If this is empty, only the new design uses that list, while the classic one tests the instance itself.
# Use only lists which you trust, as the names in them may contain HTML.
librespeed_environment_variables_server_list_url: "{{ 'server-list.json' if librespeed_environment_variables_mode in ['frontend', 'dual'] else '' }}"

# Specify the API key for ipinfo.io
#
# If it is set, LibreSpeed may send the clients' IP addresses to ipinfo.io in order to look up their ISP
# and to estimate the distance from the server.
# Otherwise, it uses a database which comes with the container image, without sending the IP addresses anywhere.
# See: `librespeed_config_getIp_ispInfo`
librespeed_environment_variables_ipinfo_apikey: ""

# Control whether test results are saved in the database at `librespeed_database_path`
#
# LibreSpeed sets `telemetry_level` in `settings.json` to `basic` if this is true, so other levels cannot be used.
# It has no effect in the `backend` mode.
librespeed_environment_variables_telemetry: false

# Specify the password of the stats page at `/results/stats.php`, which lists the saved results.
# It is required if `librespeed_environment_variables_telemetry` is true.
librespeed_environment_variables_password: ""

# Specify the email address which the privacy policy shows for requests to delete data.
# It is required if `librespeed_environment_variables_telemetry` is true.
librespeed_environment_variables_gdpr_email: ""

# Control whether the IDs of the saved results are obfuscated, instead of being sequential
librespeed_environment_variables_enable_id_obfuscation: false

# Specify the salt for obfuscating the IDs, as a quoted hexadecimal number of up to 8 digits (e.g. "0x1234abcd").
# It is required if `librespeed_environment_variables_enable_id_obfuscation` is true. Otherwise LibreSpeed
# would generate a new one each time the container starts, which changes the IDs of the results saved before.
librespeed_environment_variables_obfuscation_salt: ""

# Control whether IP addresses are redacted from the saved results
librespeed_environment_variables_redact_ip_addresses: false

# Additional environment variables.
librespeed_environment_variables_additional_variables: ""

# A list of test servers which the frontend offers to clients.
# If it has several servers, the one which responds fastest is selected automatically.
#
# Each server is specified as below:
# - name: Example
#   server: //speedtest.example.com/
#   dlURL: garbage.php
#   ulURL: empty.php
#   pingURL: empty.php
#   getIpURL: getIP.php
librespeed_server_list: "{{ librespeed_server_list_default + librespeed_server_list_auto + librespeed_server_list_custom }}"
# The instance itself, unless it runs without a backend.
# The address is relative (unlike in the list which the container image generates), so that it works under a subpath.
librespeed_server_list_default: |
  {{
    [{
      'name': 'local',
      'server': 'backend',
      'dlURL': 'garbage.php',
      'ulURL': 'empty.php',
      'pingURL': 'empty.php',
      'getIpURL': 'getIP.php',
      'sponsorName': '',
      'sponsorURL': '',
      'id': 1,
    }] if librespeed_environment_variables_mode in ['standalone', 'dual'] else []
  }}
librespeed_server_list_auto: []
librespeed_server_list_custom: []

# The `librespeed_config_*` variables below have no effect on the classic design
# (see `librespeed_environment_variables_use_new_design`).

# Controls the `test_order` value in the `settings.json` file.
# I=IP address, D=download, U=upload, P=ping and jitter, _=delay of 1 second
librespeed_config_test_order: ID_U_P

# Controls the `time_dl_max` value (maximum duration of the download test in seconds) in the `settings.json` file.
librespeed_config_time_dl_max: 12

# Controls the `time_ul_max` value (maximum duration of the upload test in seconds) in the `settings.json` file.
librespeed_config_time_ul_max: 12

# Controls the `time_auto` value (whether tests take less time on faster connections) in the `settings.json` file.
librespeed_config_time_auto: false

# Controls the `time_dlGraceTime` and `time_ulGraceTime` values in the `settings.json` file:
# how long to wait (in seconds) before measuring the speed.
#
# With 0, the time a connection needs to reach its full speed lowers the result.
# The classic design uses 1.5 and 3.
librespeed_config_time_dlGraceTime: 0  # noqa var-naming
librespeed_config_time_ulGraceTime: 0  # noqa var-naming

# Controls the `getIp_ispInfo` value (whether the client's ISP is shown) in the `settings.json` file.
# See: `librespeed_environment_variables_ipinfo_apikey`
librespeed_config_getIp_ispInfo: true  # noqa var-naming

# Controls the `getIp_ispInfo_distance` value in the `settings.json` file: the unit of the estimated
# distance from the server (`km` or `mi`), or `false` to not estimate it.
# This has no effect unless `librespeed_environment_variables_ipinfo_apikey` is set.
librespeed_config_getIp_ispInfo_distance: km  # noqa var-naming

# Controls the `overheadCompensationFactor` value in the `settings.json` file, which measured speeds are multiplied by
# to account for the overhead of network protocols. Set it to 1 to disable the compensation.
librespeed_config_overheadCompensationFactor: 1.06  # noqa var-naming

# Controls the `useMebibits` value (Mibit/s instead of Mbit/s) in the `settings.json` file.
# LibreSpeed's new design labels the results as Mbps in either case.
librespeed_config_useMebibits: false  # noqa var-naming

# Default LibreSpeed configuration template which covers the generic use case.
# You can customize it by controlling the various variables inside it.
#
# For a more advanced customization, you can extend the default (see `librespeed_configuration_extension_json`)
# or completely replace this variable with your own template.
#
# The side-effect of this lookup is that Ansible would even parse the JSON for us, returning a dict.
# This is unlike what it does when looking up YAML template files (no automatic parsing there).
librespeed_configuration_default: "{{ lookup('template', 'templates/settings.json.j2', convert_data=False) | from_json }}"

# Your custom JSON configuration for LibreSpeed should go to `librespeed_configuration_extension_json`.
# This configuration extends the default starting configuration (`librespeed_configuration_default`).
#
# You can override individual variables from the default configuration, or introduce new ones.
# See https://github.com/librespeed/speedtest/blob/master/doc.md#test-parameters for the available ones.
#
# If you need something more special, you can take full control by
# completely redefining `librespeed_configuration_default`.
librespeed_configuration_extension_json: '{}'

librespeed_configuration_extension: "{{ librespeed_configuration_extension_json | from_json if librespeed_configuration_extension_json | from_json is mapping else {} }}"

# Holds the final LibreSpeed configuration (a combination of the default and its extension), which goes to `settings.json`.
# You most likely don't need to touch this variable. Instead, see `librespeed_configuration_default`.
librespeed_configuration: "{{ librespeed_configuration_default | combine(librespeed_configuration_extension, recursive=True) }}"

# librespeed_restart_necessary controls whether the LibreSpeed systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
librespeed_restart_necessary: false
